<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuakua Craft | Launching Store...</title>
  <link rel="icon" type="image/png" href="frontend/public/assets/kuakua-logo.png">
  <meta http-equiv="refresh" content="0; url=frontend/dist/index.html">
  <script>
    // Automatic immediate redirect to compiled frontend
    window.location.replace('frontend/dist/index.html' + window.location.search + window.location.hash);
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
    }
    .launch-card {
      text-align: center;
      padding: 40px 32px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      max-width: 460px;
      width: 100%;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      margin: 0 0 10px;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }
    p {
      margin: 0 0 24px;
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.5;
    }
    .open-btn {
      display: inline-block;
      padding: 12px 28px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }
    .open-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.5);
    }
  </style>
</head>
<body>
  <div class="launch-card">
    <div class="spinner"></div>
    <h2>Opening Kuakua Craft</h2>
    <p>Redirecting to store... If your browser does not redirect automatically, click below:</p>
    <a href="frontend/dist/index.html" class="open-btn">Open Kuakua Craft Store</a>
  </div>
</body>
</html>
