<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./assets/kuakua-logo.png" />
    <script>
      // If opened via VS Code Live Server (port 5500/5501 or file protocol), redirect to the compiled dist bundle
      (function() {
        var isLiveServer = window.location.port === '5500' || window.location.port === '5501' || window.location.protocol === 'file:';
        if (isLiveServer && !window.location.pathname.includes('/dist/')) {
          var basePath = window.location.pathname.replace(/\/index\.html$|\/$/, '');
          window.location.replace(basePath + '/dist/index.html' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kuakua Craft - Premium handcrafted art, resin decor, Montessori wooden toys, art supplies, and artisan lifestyle essentials." />
    <title>Kuakua Craft | Handcrafted Art, Resin & Boutique Studio</title>

    <!-- Google Fonts: Outfit & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for premium icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
